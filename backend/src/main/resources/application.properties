spring.application.name=dativa-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/dativa
spring.datasource.username=dativa
spring.datasource.password=dativa

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

dativa.jwt.secret=dativa-local-dev-secret-change-me-32b
dativa.jwt.expiration-ms=86400000
dativa.cors.allowed-origins=http://localhost:4200,http://localhost:4201
dativa.realtime.demo-publisher=true
