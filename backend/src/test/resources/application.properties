spring.datasource.url=jdbc:h2:mem:dativa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
dativa.jwt.secret=dativa-local-dev-secret-change-me-32b
dativa.jwt.expiration-ms=86400000
dativa.realtime.demo-publisher=false
spring.task.scheduling.enabled=false
